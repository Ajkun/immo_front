<section class="layout-home8 bg-img-2 ratio_landscape">
  <div class="container p-0 search-bar">
    <div class="row m-0">
      <div class="col-xl-7 col-lg-8 full-width">
        <div class="home-left-content">
          <div class="home-content">
            <h1 class="mt-0">
              Association Régionale des Agents
              <br />
              Immobiliers
            </h1>
            <h6 class="font-roboto mb-0">L'association ARAI a pour objet de fédérer les Professionnels de l’Immobilier dans le but de leur offrir les ressources nécessaires au renforcement de leur légitimité et à la reconnaissance de leur profession.</h6>
          </div>
          <div class="search-with-tab">
            <ul class="nav nav-tabs" id="home-tab" role="tablist">
              <li class="nav-item">
                <a class="nav-link active" role="tab" [ngClass]="{'active show': openTab == 'sell'}" (click)="tabbed('sell')" style="cursor: pointer;">A Vendre</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" role="tab" [ngClass]="{'active show': openTab == 'rent'}" (click)="tabbed('rent')" style="cursor: pointer;">A Louer</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" role="tab" [ngClass]="{'active show': openTab == 'meuble'}" (click)="tabbed('meuble')" style="cursor: pointer;">A Louer Meublé</a>
              </li>
            </ul>
            <div class="tab-content" id="home-tabContent">
              <div class="tab-pane fade show active active">
                <app-filter-box-two></app-filter-box-two>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-xl-5 col-lg-4">
        <div class="home-right-image">
          <img src="assets/images/others/background-search.webp" alt="background-image" class="bg-img">
        </div>
      </div>
    </div>
    <div class="bg-dots" style="z-index: 1;">
      <app-animation-dots></app-animation-dots>
    </div>
  </div>
</section>
