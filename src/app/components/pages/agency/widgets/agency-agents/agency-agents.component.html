<div class="property-box">
  <div class="agent-image">
    <div class="bg-size" [style.background-image]="'url('+agency.img+')'">
      <img [src]="agency.img" class="bg-img" alt="agency-image">
      <span class="label label-shadow">{{ agency.property }} properties</span>
      <div class="agent-overlay"></div>
      <div class="overlay-content">
        <ul>
          <li><a href="https://accounts.google.com/" target="_blank"><img src="assets/images/about/icon-1.png" alt="google-logo"></a>
          </li>
          <li><a href="https://twitter.com/" target="_blank"><img src="assets/images/about/icon-2.png" alt="twitter-logo"></a>
          </li>
          <li><a href="https://www.facebook.com/" target="_blank"><img src="assets/images/about/icon-3.png" alt="facebook-logo"></a>
          </li>
        </ul>
        <span>Connect</span>
      </div>
    </div>
  </div>
  <div class="agent-content">
    <h3><a href="javascript:void(0)" [routerLink]="['/agent/agent-profile']">{{ agency.title }}</a></h3>
   <!-- <p class="font-roboto">{{ agency.subTitle }}</p>-->
    <ul class="agent-contact">
      <li [ngClass]="{ 'show' : isMobile }">
        <i class="fas fa-phone-alt"></i>
        <span [ngClass]="isMobile == true ? 'phone-number' : 'character'">{{ mobileNumber }}</span>
        <span class="label label-light label-flat color-2" (click)="showMobile(agency)" style="font-size: 14px;"> {{ isMobile ? 'Masquer' : 'Afficher'}} </span>
      </li>
      <li><i class="fas fa-envelope"></i> {{ agency.email }}</li>
     <!-- <li><i class="fas fa-fax"></i> {{ agency.fax }}</li>-->
    </ul>
    <a href="javascript:void(0)" [routerLink]="['/agency/agency/'+ agency.id]">Voir Profile <i class="fas fa-arrow-right"></i></a>
  </div>
</div>
